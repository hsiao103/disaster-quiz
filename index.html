<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>知識王</title>
<style>
:root{--p0:#ffb020;--p1:#38bdf8;--p2:#a3e635;--p3:#f472b6;--bg:#0b1d22;--bg2:#12303a;--card:#173b47;--line:#2a5663;--ink:#f3f6fb;--mute:#9fb2cc;--acc:#ff8a3d;--ok:#2fb67c;--bad:#ef5b5b}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;background:linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px) 0 0/32px 32px,linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px) 0 0/32px 32px,radial-gradient(1200px 700px at 20% -10%,#14414a 0,transparent 60%),var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
.btn{background:var(--card);border:1px solid var(--line);padding:.6em 1.1em;border-radius:10px;font-weight:600;transition:.15s}
.btn:hover:not(:disabled){border-color:var(--acc)}
.btn.pri{background:var(--acc);color:#1b1006;border-color:var(--acc)}
.btn.danger{border-color:#7a3340;color:#ffb4bd}
.btn:disabled{opacity:.4;cursor:not-allowed}
.ok{color:var(--ok)}.bad{color:var(--bad)}.mu{color:var(--mute)}
svg{display:block}
/* ===== 角色頭像 ===== */
.pav,.mini,.big,.chip{overflow:hidden;background:rgba(255,255,255,.07);border:.4vh solid var(--pc,var(--line));border-radius:50%;flex:none}
.pav svg,.mini svg,.big svg,.chip svg{width:100%;height:100%}
.mini{width:40px;height:40px;border-width:2px}
.big{width:150px;height:150px;border-width:4px;margin:0 auto}
/* ===== 首頁 ===== */
.home{max-width:980px;margin:0 auto;padding:48px 20px;text-align:center}
.home h1{font-size:clamp(32px,6vw,56px);margin-bottom:10px}
.home>p{color:var(--mute);margin-bottom:34px}
.hcards{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:18px}
.hc{background:var(--bg2);border:1px solid var(--line);border-radius:18px;padding:24px;display:flex;flex-direction:column;gap:12px;text-align:left}
.hc h2{font-size:20px}.hc p{color:var(--mute);font-size:14px;flex:1}
.hc input{background:#0a181c;border:1px solid var(--line);border-radius:10px;padding:.7em 1em;font-size:20px;letter-spacing:.3em;text-align:center}
.chars{display:flex;justify-content:center;gap:14px;margin:0 0 26px}
.chars .pav{width:72px;height:72px;border-width:3px}
/* ===== 主持人 ===== */
.host{max-width:1150px;margin:0 auto;padding:18px 18px 60px}
.hh{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:12px}
.hh h1{font-size:clamp(18px,3vw,26px)}
.sub{font-size:13px;color:var(--mute);margin-top:4px}
.room{background:var(--bg2);border:1px solid var(--line);border-radius:14px;padding:8px 18px;text-align:center}
.room small{display:block;color:var(--mute);font-size:12px}
.room b{font-size:32px;letter-spacing:.15em;color:var(--acc)}
.linkbar{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
.panel{background:var(--bg2);border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:14px}
.panel h3{font-size:16px;margin-bottom:12px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:760px){.grid2{grid-template-columns:1fr}}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.row>label.t{min-width:6.5em;color:var(--mute);font-size:14px}
select{background:#0a181c;border:1px solid var(--line);border-radius:8px;padding:.45em .7em}
.cats{display:flex;flex-wrap:wrap;gap:8px}
.cats label{background:#0a181c;border:1px solid var(--line);border-radius:999px;padding:.3em .85em;font-size:14px;cursor:pointer;display:flex;gap:6px;align-items:center}
.slots{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.slot{background:#0a181c;border:1px dashed var(--line);border-radius:12px;padding:10px;min-height:68px;display:flex;align-items:center;gap:10px}
.slot.on{border-style:solid;border-color:var(--pc,var(--ok))}
.slot .mini{width:46px;height:46px}
.slot .nm{flex:1;min-width:0}
.slot .nm small{display:block;color:var(--mute);font-size:12px}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--bad);margin-right:6px}
.dot.on{background:var(--ok)}
.qcard .qtxt{font-size:20px;font-weight:700;line-height:1.5;margin:6px 0 12px}
.hopts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.hopt{display:flex;gap:8px;padding:10px 12px;border-radius:10px;background:#0a181c;border:1px solid var(--line);font-size:15px}
.hopt.right{border-color:var(--ok);background:rgba(47,182,124,.15)}
.hexp{margin-top:12px;padding:12px;border-left:4px solid var(--acc);background:rgba(255,138,61,.1);border-radius:8px;font-size:15px;line-height:1.6}
.ctrls{display:flex;flex-wrap:wrap;gap:10px;margin-top:4px}
.ctrls .btn{font-size:15px;padding:.75em 1.2em}
.tag{display:inline-block;background:var(--card);border-radius:999px;padding:.15em .8em;font-size:13px;color:var(--mute);margin-right:8px}
.tag.hi{background:var(--acc);color:#1b1006;font-weight:700}
table{width:100%;border-collapse:collapse;font-size:15px}
td,th{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left}
th{color:var(--mute);font-weight:500;font-size:13px}
.big-time{font-size:26px;font-weight:800;color:var(--acc)}
.secret{font-size:12px;color:var(--acc);margin-bottom:6px}
/* ===== 大螢幕 ===== */
.scr{height:100vh;display:flex;flex-direction:column;padding:2vh 3vw;gap:1.5vh;overflow:hidden;position:relative}
.scr.center,.scr.lobby{align-items:center;justify-content:center;text-align:center}
.scr .ttl{font-size:clamp(36px,6vw,110px);font-weight:900;letter-spacing:.05em}
.joinbox{font-size:clamp(16px,2.2vw,38px);line-height:1.7;color:var(--mute)}
.joinbox b{color:var(--ink)}
.bigroom{font-size:clamp(60px,12vw,200px);font-weight:900;color:var(--acc);letter-spacing:.12em;line-height:1}
.hint{font-size:clamp(16px,2vw,32px);color:var(--mute)}
.scr .plist{display:flex;gap:1vw;width:100%}
.scr .plist.big{max-width:1500px}
.top{display:flex;align-items:center;gap:1.6vw;font-size:clamp(14px,1.8vw,30px)}
.top .cat{background:var(--acc);color:#1b1006;font-weight:800;padding:.2em .9em;border-radius:999px}
.top .lv{background:var(--card);border:1px solid var(--line);padding:.2em .8em;border-radius:999px;color:var(--ink)}
.top .no{color:var(--mute)}
.stage{display:inline-flex;gap:.5em;align-items:center;background:linear-gradient(90deg,#14b8a6,#0ea5e9);color:#04202a;font-weight:800;padding:.2em 1em;border-radius:999px;font-size:1.05em;box-shadow:0 2px 12px #0006}
.stage i{font-style:normal;opacity:.55}
.stagebar{font-size:clamp(18px,2.6vw,40px);margin:.4em 0}
.hstage{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px;font-size:15px}
.mx{border-collapse:separate;border-spacing:5px;margin:4px 0 10px}
.mx th,.mx td{padding:0}
.mx button{font:inherit;cursor:pointer;border:1px solid var(--line);border-radius:10px;padding:.45em .8em;min-width:4.6em;background:#0a181c;color:var(--mute)}
.mx button.hd.on{background:var(--acc);color:#1b1006;font-weight:700;border-color:var(--acc)}
.mx button.ce.on{background:#0f766e;color:#fff;border-color:#14b8a6;font-weight:700}
.mx button.ce small{display:block;font-size:11px;opacity:.8}
.qa{display:flex;gap:8px;flex-wrap:wrap;margin:4px 0 8px}
.qa .btn{padding:.35em .9em;font-size:13px}
.warn{color:#fbbf24;font-size:13px}
.timer{margin-left:auto;display:flex;align-items:center;gap:1vw;flex:1;max-width:34vw}
.bar{flex:1;height:1.2vh;background:#0a181c;border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--acc);width:100%;transition:width .2s linear}
.timer b{font-size:clamp(22px,3.2vw,56px);min-width:2.2em;text-align:right}
.question{font-size:clamp(22px,3.5vw,64px);font-weight:800;line-height:1.35;background:var(--bg2);border:1px solid var(--line);padding:1.8vh 2.5vw;border-radius:1.2vw}
.scr.rev .question{font-size:clamp(20px,2.8vw,50px)}
.opts{flex:1;display:grid;grid-template-columns:1fr 1fr;gap:1.1vw;min-height:0}
.opt{display:flex;align-items:center;gap:1.4vw;padding:1vh 1.4vw;border-radius:1vw;font-size:clamp(16px,2.5vw,46px);font-weight:700;color:#1d2433;background:#f3ecdc;border-left:1vw solid var(--oc,#888);transition:.3s}
.opt.o0{--oc:#0f766e}.opt.o1{--oc:#b45309}.opt.o2{--oc:#9d174d}.opt.o3{--oc:#4338ca}.opt.t0{--oc:#15803d}.opt.t1{--oc:#b91c1c}
.opt .sym{display:inline-flex;align-items:center;justify-content:center;width:1.7em;height:1.7em;border-radius:50%;background:var(--oc);color:#fff;flex:none}
.opt .txt{flex:1}
.opt.dim{opacity:.25;filter:grayscale(.7)}
.opt.right{background:#e3f5e9;box-shadow:0 0 0 .4vw var(--ok),0 0 3vw rgba(47,182,124,.5)}
.chips{display:flex;gap:.4vw;flex:none}
.chip{width:4.4vh;height:4.4vh;border-width:.3vh}
.wait{background:rgba(255,138,61,.12);border:2px dashed var(--acc);border-radius:1vw;padding:1.2vh 2vw;font-size:clamp(14px,2vw,36px);text-align:center;font-weight:700}
.exp{background:rgba(47,182,124,.13);border:2px solid var(--ok);border-radius:1vw;padding:1.3vh 2vw;font-size:clamp(14px,2vw,36px);line-height:1.5}
.exp b{color:var(--ok)}
.pc{flex:1;background:var(--bg2);border:1px solid var(--line);border-top:.7vh solid var(--pc,var(--line));border-radius:1vw;padding:1vh 1vw;display:flex;align-items:center;gap:1vw;font-size:clamp(14px,1.8vw,30px);min-width:0}
.pc.off{opacity:.45}
.pc .pav{width:9vh;height:9vh;min-width:44px;min-height:44px}
.pinfo{min-width:0;flex:1;display:flex;flex-direction:column;gap:.3vh}
.pc .pn{color:var(--pc,var(--mute));font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pc .ps{font-size:1.9em;font-weight:900;line-height:1.05;color:var(--pc,var(--ink))}
.pc .pst{font-size:.8em;white-space:nowrap}
.pbar{height:.9vh;background:#0a181c;border-radius:9px;overflow:hidden;margin-top:.3vh}
.pbar i{display:block;height:100%;background:var(--pc);border-radius:9px}
.plist.big .pc{flex-direction:column;text-align:center;padding:2vh 1vw;gap:1.2vh}
.plist.big .pc .pav{width:15vh;height:15vh}
.plist.big .pc.empty{justify-content:center;min-height:24vh;border-style:dashed;color:var(--mute)}
.pause{position:absolute;inset:0;background:rgba(8,14,24,.82);display:flex;align-items:center;justify-content:center;font-size:clamp(40px,8vw,140px);font-weight:900;z-index:5}
.lost{position:fixed;right:12px;top:10px;background:#5a2330;color:#ffd0d6;padding:4px 12px;border-radius:999px;font-size:13px;z-index:9}
.rank{width:100%;max-width:1100px;display:flex;flex-direction:column;gap:1.2vh}
.rk{display:flex;align-items:center;gap:2vw;background:var(--bg2);border:1px solid var(--line);border-left:1vw solid var(--pc);border-radius:1.2vw;padding:1vh 2vw;font-size:clamp(20px,3.4vw,60px);font-weight:800}
.rk .pav{width:9vh;height:9vh}
.rk .m{font-size:1.3em;min-width:1.4em}.rk .n{flex:1;text-align:left;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--pc)}.rk .sc{color:var(--pc)}
.rk.first{background:rgba(255,138,61,.15)}
/* ===== 選手（手機）===== */
.pl{min-height:100dvh;display:flex;flex-direction:column;padding:14px;gap:12px;max-width:640px;margin:0 auto}
.pl.center{justify-content:center;align-items:center;text-align:center}
.pl .bar2{display:flex;justify-content:space-between;align-items:center;gap:8px;background:var(--bg2);border:1px solid var(--line);border-top:4px solid var(--pc);border-radius:14px;padding:8px 14px;font-weight:700}
.pl .bar2 .who{display:flex;align-items:center;gap:10px;color:var(--pc);min-width:0}
.pl .bar2 .sc2{color:var(--pc)}
.pl .bar2 span.g{color:var(--mute);font-weight:500;font-size:14px}
.pl h2{font-size:24px}
.pl input{background:#0a181c;border:1px solid var(--line);border-radius:12px;padding:.8em 1em;font-size:22px;text-align:center;width:100%;max-width:320px}
.btns{flex:1;display:grid;grid-template-columns:1fr 1fr;gap:12px;min-height:50vh}
.ab{border:0;border-radius:22px;color:#1d2433;background:#f3ecdc;border-left:16px solid var(--oc,#888);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;box-shadow:0 6px 0 rgba(0,0,0,.4);transition:.1s}
.ab span{font-size:clamp(48px,15vw,90px);line-height:1;font-weight:900;color:var(--oc)}
.ab b{font-size:20px;opacity:.7}
.ab:active:not(:disabled){transform:translateY(4px);box-shadow:0 2px 0 rgba(0,0,0,.4)}
.ab.o0{--oc:#0f766e}.ab.o1{--oc:#b45309}.ab.o2{--oc:#9d174d}.ab.o3{--oc:#4338ca}.ab.t0{--oc:#15803d}.ab.t1{--oc:#b91c1c}
.ab:disabled{opacity:.4}
.ab.sel{opacity:1;outline:5px solid var(--acc)}
.msg{text-align:center;color:var(--mute);min-height:1.5em}
.result{border-radius:20px;padding:26px 18px;text-align:center;font-size:30px;font-weight:900}
.result.ok2{background:rgba(47,182,124,.2);border:2px solid var(--ok)}
.result.no2{background:rgba(239,91,91,.18);border:2px solid var(--bad)}
.result.nn{background:var(--bg2);border:2px solid var(--line)}
.result small{display:block;font-size:16px;font-weight:500;color:var(--mute);margin-top:8px}
.pause2{position:fixed;inset:0;background:rgba(8,14,24,.85);display:flex;align-items:center;justify-content:center;font-size:36px;font-weight:900;z-index:5}
/* ===== 大螢幕等待畫面（含 QR）===== */
.scr.lobby2{justify-content:space-between;align-items:center;text-align:center;padding:2.2vh 3vw}
.lobby2 .lt{font-size:clamp(30px,5vw,88px);font-weight:900;letter-spacing:.04em;line-height:1.1}
.lobby2 .stagebar{margin:.2em 0 0}
.lobby2 .lmain{display:flex;align-items:center;justify-content:center;gap:5vw;width:100%}
.lobby2 .lleft{display:flex;flex-direction:column;align-items:center;gap:1vh;min-width:0}
.lobby2 .joinbox{font-size:clamp(14px,1.9vw,34px);line-height:1.6}
.lobby2 .bigroom{font-size:clamp(56px,11vw,190px)}
.lobby2 .rlabel{font-size:clamp(14px,1.8vw,30px);color:var(--mute);letter-spacing:.2em}
.lobby2 .lqr{display:flex;flex-direction:column;align-items:center;gap:1vh}
.qrbox{background:#fff;border-radius:1.2vw;padding:.7vw;width:min(36vh,26vw);box-shadow:0 0 0 .45vw var(--acc),0 1vh 4vh #0008}
.qrbox svg{width:100%;height:auto}
.qrcap{font-size:clamp(16px,2.2vw,38px);font-weight:800}
.qrurl{font-size:clamp(10px,1.05vw,18px);color:var(--mute);word-break:break-all;max-width:min(36vh,26vw)}
.lobby2 .plist.lg{max-width:1500px}
.lobby2 .plist.lg .pc{padding:1.2vh .8vw}
.lobby2 .plist.lg .pc .pav{width:9vh;height:9vh}
.lobby2 .plist.lg .pc.empty{justify-content:center;min-height:12vh;border-style:dashed;color:var(--mute)}
.lobby2 .hint{font-size:clamp(14px,1.8vw,30px)}
/* ===== 題庫管理 ===== */
.bk{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.bkmsg{margin-top:8px;padding:10px 12px;border-radius:10px;font-size:14px;line-height:1.6;background:rgba(47,182,124,.12);border:1px solid var(--ok)}
.bkmsg.err{background:rgba(239,91,91,.12);border-color:var(--bad)}
.bkmsg small{display:block;color:var(--mute)}
details.fmt{margin-top:6px;font-size:14px;color:var(--mute)}
details.fmt summary{cursor:pointer;color:var(--ink)}
details.fmt table{margin-top:8px;font-size:13px}
details.fmt code{background:#0a181c;padding:.05em .4em;border-radius:5px;color:var(--ink)}
/* ===== 首頁頁尾：作者圖示與 FB ===== */
.wtc{margin-top:52px;padding-top:26px;border-top:1px solid var(--line);display:flex;align-items:center;justify-content:center;gap:16px;flex-wrap:wrap}
.wtc .lg{background:#fff;border-radius:16px;padding:6px 8px;display:flex;box-shadow:0 2px 10px #0006}
.wtc .lg img{display:block;height:56px;width:auto}
.wtc .fb{color:var(--ink);text-decoration:none;display:inline-flex;align-items:center;gap:9px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:.5em 1.1em .5em .6em;font-weight:600;transition:.15s}
.wtc .fb:hover{border-color:#1877f2;background:#1b3a5c}
.wtc .fb i{width:26px;height:26px;border-radius:50%;background:#1877f2;color:#fff;display:grid;place-items:center;font-style:normal;font-weight:900;font-size:17px;line-height:1;font-family:Arial,sans-serif}
.wtc .fb:focus-visible{outline:3px solid var(--acc);outline-offset:3px}
.wtc .so{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap}
</style>
</head>
<body>

<script>
(function(){
'use strict';
const app=document.getElementById('app');
const $=(s,r)=>(r||document).querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
/* ===== 模組設定（由 config.js 覆寫）===== */
const UC=window.GAME_CONFIG||{};
const CFG=Object.assign({title:'知識王',icon:'🎓',subtitle:'一個大螢幕・2–4 位選手・教師遙控的搶答遊戲',storageKey:'fkquiz',peerPrefix:'',publicUrl:'',
  lv1Suffix:'年級',tierOrder:[],stageSuffix:'競賽',characters:['安安隊長','小水手','頭巾俠','探險家'],csvUrl:'',
  pointsBase:100,pointsSpeed:50,defaultN:20,defaultLimit:20,theme:{},templateRows:null},UC);
CFG.labels=Object.assign({lv1:'年級',lv2:'難度',cat:'類別'},UC.labels||{});

document.title=CFG.title;
try{Object.keys(CFG.theme||{}).forEach(k=>document.documentElement.style.setProperty('--'+k,CFG.theme[k]));}catch(e){}
const MAXP=4, LBL=['A','B','C','D'];

const base=pageBase;
const isLocalHost=/^(localhost|127\.|0\.0\.0\.0|\[::1\])/.test(location.hostname);
const pubBase=(/^https?:$/.test(location.protocol)&&!isLocalHost)?pageBase:(CFG.publicUrl||pageBase);

/* ===== 題庫（可由教師以 CSV 取代）===== */
let BANK=[],GRADES=[],TIERS=[],CATS=[],DEFAULT_ROWS=[];
let bankInfo={src:'builtin',name:'內建題庫'},defInfo={src:'builtin',name:'內建題庫'},bankMsg=null;
const isNum=v=>typeof v==='number';
function setBank(rows){
  BANK=rows;
  const gs=[...new Set(rows.map(r=>r[5]))];
  GRADES=gs.filter(isNum).sort((a,b)=>a-b).concat(gs.filter(x=>!isNum(x)));

  TIERS=ord.filter(x=>ts.includes(x)).concat(ts.filter(x=>!ord.includes(x)));
  CATS=[...new Set(rows.map(r=>r[0]))];
}
function fixCfg(c){
  c.grades=(c.grades||[]).filter(x=>GRADES.includes(x));if(!c.grades.length)c.grades=GRADES.slice();
  c.tiers=(c.tiers||[]).filter(x=>TIERS.includes(x));if(!c.tiers.length)c.tiers=TIERS.slice();
  c.cats=(c.cats||[]).filter(x=>CATS.includes(x));if(!c.cats.length)c.cats=CATS.slice();
}
const CNUM=['','一','二','三','四','五','六','七','八','九','十'];
const lvDigits=v=>isNum(v)?v+CFG.lv1Suffix:String(v==null?'':v);
const lvCN=v=>isNum(v)&&v>=1&&v<=10?CNUM[v]+CFG.lv1Suffix:lvDigits(v);
const lvTag=q=>[q.grade===''||q.grade==null?'':lvDigits(q.grade),q.tier||''].filter(Boolean).join('・');
const lvSpan=(q,cls)=>lvTag(q)?`<span class="${cls}">${esc(lvTag(q))}</span>`:'';

/* ---- CSV 解析 / 匯入 / 匯出 ---- */
function parseCSV(text){
  if(text.charCodeAt(0)===0xFEFF)text=text.slice(1);
  const first=text.split(/\r?\n/)[0]||'';
  const cnt=ch=>first.split(ch).length;
  const delim=cnt('\t')>cnt(',')?'\t':(cnt(';')>cnt(',')?';':',');
  const rows=[];let row=[],cur='',inq=false;
  for(let i=0;i<text.length;i++){const ch=text[i];
    if(inq){if(ch==='"'){if(text[i+1]==='"'){cur+='"';i++;}else inq=false;}else cur+=ch;}
    else if(ch==='"')inq=true;
    else if(ch===delim){row.push(cur);cur='';}
    else if(ch==='\n'||ch==='\r'){if(ch==='\r'&&text[i+1]==='\n')i++;row.push(cur);cur='';rows.push(row);row=[];}
    else cur+=ch;}
  if(cur!==''||row.length){row.push(cur);rows.push(row);}
  return rows.filter(r=>r.some(c=>String(c).trim()!==''));
}
function decodeBuf(buf){
  const u8=new Uint8Array(buf);
  if(u8[0]===0xFF&&u8[1]===0xFE)return new TextDecoder('utf-16le').decode(u8);
  try{return new TextDecoder('utf-8',{fatal:true}).decode(u8);}catch(e){}
  try{return new TextDecoder('big5').decode(u8);}catch(e){}
  return new TextDecoder('utf-8').decode(u8);
}
const HDR={
  lv1:['年級','組別','層級','lv1','grade','level1','group',CFG.labels.lv1],
  lv2:['難度','關卡','等級','階段','lv2','tier','level','level2',CFG.labels.lv2],
  cat:['類別','主題','分類','category','cat','topic',CFG.labels.cat],
  type:['題型','type'],
  q:['題目','問題','題幹','question','q'],
  ans:['正解','答案','正確答案','correct','answer','ans'],
  w1:['錯誤1','錯誤選項1','選項2','wrong1','w1'],
  w2:['錯誤2','錯誤選項2','選項3','wrong2','w2'],
  w3:['錯誤3','錯誤選項3','選項4','wrong3','w3'],
  exp:['解析','重點','說明','解說','explanation','exp','note']
};
const CNDIG={'一':1,'二':2,'三':3,'四':4,'五':5,'六':6,'七':7,'八':8,'九':9,'十':10};
function normLv1(s){
  s=String(s||'').trim();if(!s)return'';
  let x=s.replace(new RegExp(CFG.lv1Suffix+'$'),'').replace(/年級$|年$/,'').trim();
  if(/^\d+$/.test(x))return parseInt(x,10);
  if(x.length===1&&CNDIG[x])return CNDIG[x];
  return s;
}
const TRUE_S=['○','o','O','〇','對','正確','是','true','t','1','yes','y','✓','v'];
const FALSE_S=['✕','x','X','×','✗','錯','錯誤','否','false','f','0','no','n'];
function rowsToBank(rows){
  const res={bank:[],errors:[]};
  if(!rows.length){res.errors.push('檔案是空的');return res;}
  const head=rows[0].map(h=>String(h).trim().toLowerCase());
  const col={};
  Object.keys(HDR).forEach(k=>{col[k]=head.findIndex(h=>HDR[k].some(a=>String(a).toLowerCase()===h));});
  if(col.q<0||col.ans<0){res.errors.push('找不到必要欄位：第一列必須有「題目」與「正解」欄位名稱（可先下載範本）');return res;}
  const get=(r,k)=>col[k]>=0?String(r[col[k]]==null?'':r[col[k]]).trim():'';
  const seen=new Set();
  for(let i=1;i<rows.length&&res.bank.length<5000;i++){
    const r=rows[i],ln='第 '+(i+1)+' 列';
    const q=get(r,'q'),ans=get(r,'ans');
    if(!q){res.errors.push(ln+'：題目是空的');continue;}
    if(!ans){res.errors.push(ln+'：正解是空的');continue;}
    const ws=[get(r,'w1'),get(r,'w2'),get(r,'w3')].filter(Boolean);
    const tp=get(r,'type');
    const isTF=/是非|判斷|tf|true|○|○×|judge/i.test(tp)||(!tp&&ws.length===0&&(TRUE_S.includes(ans)||FALSE_S.includes(ans)));
    const cat=get(r,'cat')||'未分類',exp=get(r,'exp')||'',l1=normLv1(get(r,'lv1')),l2=get(r,'lv2');
    if(seen.has(q)){res.errors.push(ln+'：題目與前面重複，已略過');continue;}
    if(isTF){
      const a=TRUE_S.includes(ans)?true:FALSE_S.includes(ans)?false:null;
      if(a===null){res.errors.push(ln+'：是非題的正解請填 ○ 或 ✕（或 對／錯）');continue;}
      res.bank.push([cat,q,['○ 正確','✕ 錯誤'],a?0:1,exp,l1,l2]);
    }else{
      if(ws.length!==3){res.errors.push(ln+'：選擇題需要 1 個正解與 3 個錯誤選項（錯誤1～錯誤3）');continue;}
      const opts=[ans,...ws];
      if(new Set(opts).size!==4){res.errors.push(ln+'：選項內容有重複');continue;}
      res.bank.push([cat,q,opts,0,exp,l1,l2]);
    }
    seen.add(q);
  }
  return res;
}
function csvCell(v){v=String(v==null?'':v);return /[",\n\r]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;}
const CSV_HEAD=()=>[CFG.labels.lv1,CFG.labels.lv2,CFG.labels.cat,'題型','題目','正解','錯誤1','錯誤2','錯誤3','解析'];
function bankToCSV(bank){
  const lines=[CSV_HEAD()];
  bank.forEach(r=>{
    const [cat,q,opts,ans,exp,l1,l2]=r;
    const l1s=(l1===''||l1==null)?'':lvDigits(l1);
    if(opts.length===2)lines.push([l1s,l2,cat,'是非',q,ans===0?'○':'✕','','','',exp]);
    else{const w=opts.filter((_,i)=>i!==ans);lines.push([l1s,l2,cat,'選擇',q,opts[ans],w[0]||'',w[1]||'',w[2]||'',exp]);}
  });
  return '﻿'+lines.map(l=>l.map(csvCell).join(',')).join('\r\n');
}
function templateCSV(){
  const rows=CFG.templateRows||[
    ['A組','第1關','常識','選擇','臺灣最高的山是哪一座？','玉山','阿里山','合歡山','雪山','玉山海拔約 3,952 公尺，是臺灣第一高峰。'],
    ['A組','第1關','常識','是非','水在一大氣壓下，攝氏 100 度會沸騰。','○','','','','這是水的沸點。'],
    ['','','自然','選擇','下列哪一種動物屬於哺乳類？','鯨魚','鯊魚','鱷魚','青蛙','鯨魚用肺呼吸並哺乳。（年級／難度可留白）']
  ];
  return '﻿'+[CSV_HEAD()].concat(rows).map(l=>l.map(csvCell).join(',')).join('\r\n');
}
function download(name,text){
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type:'text/csv;charset=utf-8'}));a.download=name;
  document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},500);
}
async function loadBank(){
  let def=(typeof QUESTIONS!=='undefined')?QUESTIONS:[];
  if(CFG.csvUrl&&/^https?:$/.test(location.protocol)){
    try{const r=await fetch(CFG.csvUrl,{cache:'no-cache'});
      if(r.ok){const res=rowsToBank(parseCSV(decodeBuf(await r.arrayBuffer())));if(res.bank.length){def=res.bank;defInfo={src:'csv',name:CFG.csvUrl};}}}catch(e){}
  }
  DEFAULT_ROWS=def;let rows=def;bankInfo=defInfo;
  try{const sv=JSON.parse(localStorage.getItem(SK+'-bank')||'null');
    if(sv&&Array.isArray(sv.rows)&&sv.rows.length){rows=sv.rows;bankInfo={src:'custom',name:sv.name||'自訂題庫',ts:sv.ts};}}catch(e){}
  setBank(rows);

/* ---- QR Code（以 SVG 繪製，投影放大也清晰）---- */
const qrCache={};
function qrSVG(text){
  if(qrCache[text])return qrCache[text];
  if(typeof qrcode==='undefined')return'';
  try{
    const q=qrcode(0,'M');q.addData(text);q.make();const n=q.getModuleCount();let d='';
    for(let r=0;r<n;r++)for(let c=0;c<n;c++)if(q.isDark(r,c))d+='M'+(c+4)+' '+(r+4)+'h1v1h-1z';
    return qrCache[text]='<svg viewBox="0 0 '+(n+8)+' '+(n+8)+'" shape-rendering="crispEdges" role="img" aria-label="QR Code"><rect width="100%" height="100%" fill="#fff"/><path d="'+d+'" fill="#111"/></svg>';
  }catch(e){return'';}
}
const rand4=()=>String(Math.floor(1000+Math.random()*9000));
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
const pcv=p=>'var(--p'+(((p&&p.ci)||0)%4)+')';
function optMeta(tf,i){return tf?{sym:i===0?'○':'✕',lab:i===0?'正確':'錯誤',cls:i===0?'t0':'t1'}:{sym:LBL[i],lab:'',cls:'o'+i};}
function stageOf(grades,tiers,cats){
  const g=GRADES.filter(x=>grades.includes(x)),ti=TIERS.filter(x=>tiers.includes(x));
  let gt='';
  if(GRADES.length>1){
    if(g.length===GRADES.length){
      gt=(GRADES.every(isNum)&&GRADES.every((v,i)=>i===0||v===GRADES[i-1]+1)&&GRADES[GRADES.length-1]<=10)?
        lvCN(GRADES[0]).replace(CFG.lv1Suffix,'')+'～'+lvCN(GRADES[GRADES.length-1])+'混合':'全部'+CFG.labels.lv1+'混合';
    }else if(g.length===1)gt=lvCN(g[0]);
    else gt=g.every(isNum)?g.map(x=>CNUM[x]||x).join('、')+CFG.lv1Suffix+'混合':g.join('、')+'混合';
  }
  const tt=TIERS.length>1?(ti.length===TIERS.length?'全'+CFG.labels.lv2+'混合':ti.length===1?ti[0]:ti.join('＋')):'';
  const ct=(cats&&cats.length&&cats.length<CATS.length)?(cats.length<=3?cats.join('、'):cats.length+' 類主題'):'';
  return{g:gt,t:tt,c:ct};
}
function stageChip(st){if(!st)return'';const parts=[st.g,st.t].filter(Boolean).map(esc).join('<i>・</i>')||'綜合';return`<span class="stage">🏅 ${parts}${esc(CFG.stageSuffix)}${st.c?`<i>・</i>${esc(st.c)}`:''}</span>`;}
function prep(r){const [cat,q,opts,ans,exp,grade,tier]=r;if(opts.length===2)return{cat,q,opts:opts.slice(),ans,exp,grade,tier};const idx=shuffle(opts.map((_,i)=>i));return{cat,q,opts:idx.map(i=>opts[i]),ans:idx.indexOf(ans),exp,grade,tier};}
function rankOf(list,p){return 1+list.filter(x=>x.score>p.score).length;}
function medal(r){return r===1?'🥇':r===2?'🥈':r===3?'🥉':'　'+r;}
function copy(text){if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(text).then(()=>alert('已複製：\n'+text),()=>prompt('請手動複製',text));else prompt('請手動複製',text);}

/* ===== 通訊層：PeerJS（跨裝置）＋ BroadcastChannel（同一台電腦的分頁備援）===== */
function makeT(room,isHost,onMsg,onStatus){
  const t={conns:[],peer:null,conn:null};
  let bc=null;try{bc=new BroadcastChannel(PP+room);}catch(e){}
  if(bc)bc.onmessage=e=>{const d=e.data;if(d&&d.to===(isHost?'host':'client'))onMsg(d.m);};
  t.send=m=>{
    if(bc)try{bc.postMessage({to:isHost?'client':'host',m});}catch(e){}
    if(isHost){t.conns.forEach(c=>{try{if(c.open)c.send(m);}catch(e){}});}
    else if(t.conn&&t.conn.open){try{t.conn.send(m);}catch(e){}}
  };
  if(typeof Peer==='undefined'){onStatus('err');return t;}
  try{
    if(isHost){
      const p=new Peer(PP+room);t.peer=p;
      p.on('open',()=>onStatus('ok'));
      p.on('error',err=>onStatus(err&&err.type==='unavailable-id'?'dup':'err'));
      p.on('disconnected',()=>{try{p.reconnect();}catch(e){}});
      p.on('connection',c=>{
        c.on('open',()=>{t.conns.push(c);});
        c.on('data',onMsg);
        c.on('close',()=>{t.conns=t.conns.filter(x=>x!==c);});
        c.on('error',()=>{});
      });
    }else{
      const p=new Peer();t.peer=p;
      const connect=()=>{
        if(t.conn&&t.conn.open)return;
        const c=p.connect(PP+room,{reliable:true});t.conn=c;
        c.on('open',()=>{onStatus('ok');onMsg({t:'_open'});});
        c.on('data',onMsg);
        c.on('close',()=>onStatus('lost'));
        c.on('error',()=>{});
      };
      p.on('open',connect);
      p.on('error',()=>{});
      setInterval(()=>{if(p.destroyed)return;if(p.disconnected){try{p.reconnect();}catch(e){}}else if(p.open&&(!t.conn||!t.conn.open))connect();},3000);
    }
  }catch(e){onStatus('err');}
  return t;
}

/* ===== 主持人 ===== */
function startHost(room){
  const KEY=SK+'-host';
  const defCfg=()=>({n:CFG.defaultN,limit:CFG.defaultLimit,cats:CATS.slice(),grades:GRADES.slice(),tiers:TIERS.slice(),auto:true,pub:false});
  const fresh=()=>({phase:'lobby',players:[],qList:[],qi:0,limit:20,remain:0,paused:false,showAns:false,cfg:defCfg()});
  let sv=null;try{sv=JSON.parse(localStorage.getItem(KEY)||'null');}catch(e){}
  let S=(sv&&sv.room===room&&sv.S)?sv.S:fresh();
  S.cfg=Object.assign(defCfg(),S.cfg||{});fixCfg(S.cfg);
  if(S.phase==='question')S.paused=true;
  S.players.forEach((p,i)=>{if(p.ci==null)p.ci=i;});
  let seen={},cloud='wait',onSig='',lastT=Date.now(),T=null;
  const persist=()=>{try{localStorage.setItem(KEY,JSON.stringify({room,S}));}catch(e){}};
  const online=cid=>Date.now()-(seen[cid]||0)<9000;
  const pool=()=>BANK.filter(r=>S.cfg.cats.includes(r[0])&&S.cfg.grades.includes(r[5])&&S.cfg.tiers.includes(r[6]));
  /* 對外公開狀態：正解、重點、得分在老師「公布」之前一律不送出 */
  function pub(){
    const q=S.qList[S.qi];const rev=S.phase==='reveal';const open=rev&&S.showAns;const mask=rev&&!S.showAns;
    return{ts:Date.now(),room,stage:(S.phase==='lobby'||!S.stage)?stageOf(S.cfg.grades,S.cfg.tiers,S.cfg.cats):S.stage,phase:S.phase,paused:S.paused,qi:S.qi,total:S.qList.length,limit:S.limit,remain:Math.round(S.remain),
      q:(q&&S.phase!=='end'&&S.phase!=='lobby')?{cat:q.cat,grade:q.grade,tier:q.tier,q:q.q,opts:q.opts,tf:q.opts.length===2,ans:open?q.ans:null,exp:open?q.exp:null}:null,
      players:S.players.map(p=>({cid:p.cid,ci:p.ci,name:p.name,score:mask?p.score-(p.gain||0):p.score,answered:p.ans!=null,choice:rev?p.ans:null,gain:open?p.gain:null,on:online(p.cid)}))};
  }
  const push=()=>T&&T.send({t:'state',s:pub()});
  function changed(){persist();render();push();}
  function onMsg(m){
    if(!m||!m.t)return;
    if(m.t==='hello'){if(m.cid)seen[m.cid]=Date.now();push();return;}
    if(m.t==='join'){
      const name=String(m.name||'').trim().slice(0,8)||'選手';
      const p=S.players.find(x=>x.cid===m.cid);
      if(p)p.name=name;
      else if(S.players.length<MAXP)S.players.push({cid:m.cid,name,ci:[0,1,2,3].find(i=>!S.players.some(x=>x.ci===i)),score:0,ans:null,ansRemain:0,gain:0});
      else T.send({t:'full',cid:m.cid});
      seen[m.cid]=Date.now();changed();return;
    }
    if(m.t==='answer'){
      const p=S.players.find(x=>x.cid===m.cid);if(!p)return;seen[m.cid]=Date.now();
      if(S.phase!=='question'||S.paused||m.q!==S.qi||p.ans!=null)return;
      const q=S.qList[S.qi];if(!(m.choice>=0&&m.choice<q.opts.length))return;
      p.ans=m.choice;p.ansRemain=S.remain;
      if(S.cfg.auto&&S.players.every(x=>x.ans!=null)){doReveal();return;}
      changed();
    }
  }
  T=makeT(room,true,onMsg,st=>{cloud=st;render();});
  function resetQ(){S.phase='question';S.paused=false;S.showAns=false;S.remain=S.limit*1000;S.players.forEach(p=>{p.ans=null;p.gain=0;p.ansRemain=0;});}
  function start(){
    const pl=pool();
    if(!pl.length){alert('目前的篩選條件沒有題目（或題庫是空的），請調整篩選條件或上傳題庫');return;}
    if(!S.players.length){alert('還沒有選手加入');return;}
    S.qList=shuffle(pl).slice(0,Math.min(S.cfg.n,pl.length)).map(prep);
    S.stage=stageOf(S.cfg.grades,S.cfg.tiers,S.cfg.cats);S.limit=S.cfg.limit;S.qi=0;S.players.forEach(p=>{p.score=0;});resetQ();changed();
  }
  /* 結算：鎖定作答並計分，但答案與得分先不對外公開 */
  function doReveal(){
    if(S.phase!=='question')return;
    const q=S.qList[S.qi];
    S.players.forEach(p=>{p.gain=0;if(p.ans===q.ans)p.gain=CFG.pointsBase+(S.limit>0?Math.round(CFG.pointsSpeed*Math.max(0,p.ansRemain)/(S.limit*1000)):0);p.score+=p.gain;});
    S.phase='reveal';S.paused=false;S.showAns=!!S.cfg.pub;changed();
  }
  function publish(){if(S.phase==='reveal'&&!S.showAns){S.showAns=true;changed();}}
  function next(){
    if(S.phase!=='reveal')return;
    if(S.qi+1>=S.qList.length)S.phase='end';else{S.qi++;resetQ();}
    changed();
  }
  function togglePause(){if(S.phase==='question'){S.paused=!S.paused;changed();}}
  function fmtT(){return S.limit>0?Math.ceil(Math.max(0,S.remain)/1000)+' 秒':'不限時';}
  setInterval(()=>{
    const now=Date.now(),dt=now-lastT;lastT=now;
    if(S.phase==='question'&&!S.paused&&S.limit>0){
      S.remain-=dt;
      if(S.remain<=0){S.remain=0;doReveal();return;}
      const el=$('#htime');if(el)el.textContent=fmtT();
    }
  },250);
  setInterval(()=>{
    push();
    const sig=S.players.map(p=>p.cid+online(p.cid)).join();
    if(sig!==onSig){onSig=sig;render();}
  },1000);
  document.addEventListener('keydown',e=>{
    if(/INPUT|SELECT|TEXTAREA/.test(e.target.tagName))return;
    if(e.code==='Space'){e.preventDefault();if(S.phase==='question')doReveal();else if(S.phase==='reveal'){if(!S.showAns)publish();else next();}}
    else if(e.key==='p'||e.key==='P')togglePause();
  });
  app.addEventListener('click',e=>{
    const b=e.target.closest('[data-act]');if(!b)return;
    const a=b.dataset.act;
    if(a==='openScreen')window.open(base+'#screen='+room,'fk-screen','width=1280,height=720');
    else if(a==='copyScreen')copy(base+'#screen='+room);
    else if(a==='copyPlay')copy(base+'#play='+room);
    else if(a==='start')start();
    else if(a==='mxT'||a==='mxG'||a==='mxC'||a==='allMix'||a==='onlyG'||a==='onlyT'||a==='catAll'||a==='catNone'){
      const c=S.cfg,gi=parseInt(b.dataset.g,10),vi=parseInt(b.dataset.v,10);
      const tog=(arr,x)=>arr.includes(x)?(arr.length>1?arr.filter(y=>y!==x):arr):[...arr,x];
      if(a==='mxT')c.tiers=tog(c.tiers,TIERS[vi]);
      else if(a==='mxG')c.grades=tog(c.grades,GRADES[vi]);
      else if(a==='mxC'){c.grades=[GRADES[gi]];c.tiers=[TIERS[vi]];}
      else if(a==='allMix'){c.grades=GRADES.slice();c.tiers=TIERS.slice();}
      else if(a==='onlyG')c.grades=[GRADES[vi]];
      else if(a==='onlyT')c.tiers=[TIERS[vi]];
      else if(a==='catAll')c.cats=CATS.slice();
      else c.cats=[];
      persist();render();push();
    }
    else if(a==='csvUp'||a==='csvAdd'){bankMode=a==='csvAdd'?'add':'replace';const f=$('#csvf');if(f){f.value='';f.click();}}
    else if(a==='csvTpl')download(CFG.title+'_題庫範本.csv',templateCSV());
    else if(a==='csvExport')download(CFG.title+'_題庫_'+BANK.length+'題.csv',bankToCSV(BANK));
    else if(a==='csvReset'){
      if(!confirm('要還原成預設題庫嗎？（已上傳的自訂題庫會從這台電腦移除）'))return;
      try{localStorage.removeItem(SK+'-bank');}catch(e){}
      setBank(DEFAULT_ROWS);bankInfo=defInfo;bankMsg={ok:true,lines:['已還原預設題庫，共 '+BANK.length+' 題。']};
      S.cfg.grades=GRADES.slice();S.cfg.tiers=TIERS.slice();S.cfg.cats=CATS.slice();persist();render();push();
    }
    else if(a==='pause')togglePause();
    else if(a==='reveal')doReveal();
    else if(a==='publish')publish();
    else if(a==='next')next();
    else if(a==='end'){if(confirm('確定要結束遊戲並顯示最終排名嗎？')){if(S.phase==='reveal')S.showAns=true;S.phase='end';changed();}}
    else if(a==='again'){S.phase='lobby';S.stage=null;S.qList=[];S.qi=0;S.showAns=false;S.players.forEach(p=>{p.score=0;p.ans=null;p.gain=0;});changed();}
    else if(a==='newroom'){if(confirm('這會清除所有選手與分數，確定嗎？')){S=fresh();changed();}}
    else if(a==='kick'){S.players=S.players.filter(p=>p.cid!==b.dataset.cid);changed();}
  });
  app.addEventListener('change',e=>{

    if(el.dataset.cfg==='n')c.n=parseInt(el.value,10);
    else if(el.dataset.cfg==='limit')c.limit=parseInt(el.value,10);

    try{localStorage.setItem(SK+'-bank',JSON.stringify({name:mode==='add'?(bankInfo.name+' ＋ '+name):name,ts:Date.now(),rows:nb}));}catch(e){saved=false;}
    bankInfo={src:'custom',name:mode==='add'&&bankInfo.src==='custom'?bankInfo.name+' ＋ '+name:(mode==='add'?defInfo.name+' ＋ '+name:name),ts:Date.now()};
    S.cfg.grades=GRADES.slice();S.cfg.tiers=TIERS.slice();S.cfg.cats=CATS.slice();
    const lines=['已'+(mode==='add'?'加入 ':'匯入 ')+added+' 題，目前題庫共 '+BANK.length+' 題。'+(dup?'（略過重複 '+dup+' 題）':'')];
    if(errs.length)lines.push('有 '+errs.length+' 列因格式問題被略過：');
    errs.slice(0,8).forEach(x=>lines.push('・'+x));if(errs.length>8)lines.push('…還有 '+(errs.length-8)+' 項');
    if(!saved)lines.push('⚠ 瀏覽器空間不足，題庫無法保存；本次使用有效，關閉頁面後需重新上傳。');

        <p class="sub" style="margin:2px 0 0">點格子＝只出該${L1}該${L2}；點「${L1}／${L2}」標題＝加入或移除（可多選混合）。格內數字為符合類別的題數。</p></div></div>`:''}
      <div class="row" style="align-items:flex-start"><label class="t">${esc(CFG.labels.cat)}</label><div><div class="cats">${CATS.map(v=>`<label><input type="checkbox" data-cat="${esc(v)}" ${c.cats.includes(v)?'checked':''}>${esc(v)} <small class="mu">${BANK.filter(r=>r[0]===v&&c.grades.includes(r[5])&&c.tiers.includes(r[6])).length}</small></label>`).join('')}</div>

    return`<div class="grid2"><div class="panel"><h3>① 遊戲設定</h3>
      <div class="row"><label class="t">題數</label><select data-cfg="n">${nOpts.map(v=>`<option value="${v}" ${c.n===v?'selected':''}>${v} 題</option>`).join('')}</select><span class="mu">符合條件的題庫共 <b style="color:var(--acc)">${poolN}</b> 題</span></div>
      <div class="row"><label class="t">每題時間</label><select data-cfg="limit">${[0,10,15,20,30,45,60].map(v=>`<option value="${v}" ${c.limit===v?'selected':''}>${v?v+' 秒':'不限時'}</option>`).join('')}</select></div>
      ${filt}
      <div class="row"><label class="t">作答結束</label><label style="color:var(--ink);font-size:14px"><input type="checkbox" data-cfg="auto" ${c.auto?'checked':''}> 全員作答後自動結算</label></div>
      <div class="row"><label class="t">公布方式</label><label style="color:var(--ink);font-size:14px"><input type="checkbox" data-cfg="pub" ${c.pub?'checked':''}> 結算後自動公布正解與得分（預設關閉，由老師手動公布）</label></div>
    </div><div class="panel"><h3>② 選手（最多 ${MAXP} 人）</h3><div class="slots">${slots}</div>
      <p class="sub" style="margin-top:10px">選手用手機掃描大螢幕上的 QR Code，或開啟「選手連結」，或在首頁輸入房號 <b>${room}</b> 與暱稱即可加入，系統會自動分配角色與顏色。</p>
      <div class="ctrls" style="margin-top:14px"><button class="btn pri" data-act="start" ${S.players.length&&poolN?'':'disabled'}>▶ 開始遊戲（${S.players.length} 位選手）</button></div>
    </div></div>${bankPanel()}`;
  }
  function gameHTML(){
    if(S.phase==='end'){
      const rows=S.players.slice().sort((a,b)=>b.score-a.score).map(p=>`<tr><td>${medal(rankOf(S.players,p))}</td><td style="color:${pcv(p)};font-weight:700">${esc(p.name)}</td><td><b>${p.score}</b> 分</td></tr>`).join('');
      return`<div class="panel"><h3>🏆 遊戲結束（共 ${S.qList.length} 題）</h3><table><tr><th>名次</th><th>選手</th><th>總分</th></tr>${rows}</table>
        <div class="ctrls" style="margin-top:14px"><button class="btn pri" data-act="again">再玩一次（保留選手）</button><button class="btn danger" data-act="newroom">清除並重設房間</button></div></div>`;
    }
    const q=S.qList[S.qi],tf=q.opts.length===2,rev=S.phase==='reveal';
    const opts=q.opts.map((o,i)=>{const m=optMeta(tf,i);return`<div class="hopt ${i===q.ans?'right':''}"><b>${m.sym}</b><span>${tf?esc(o.slice(2)):esc(o)}</span>${i===q.ans?'<span class="ok" style="margin-left:auto">✔ 正解</span>':''}</div>`;}).join('');
    const prow=S.players.map(p=>{let st;
      if(!rev)st=p.ans!=null?'<span class="ok">✔ 已作答</span>':'<span class="mu">思考中…</span>';
      else{const m=p.ans==null?null:optMeta(tf,p.ans);st=p.gain>0?`<span class="ok">${m.sym} 答對 +${p.gain}</span>`:`<span class="bad">${m?m.sym+' 答錯':'未作答'}</span>`;}
      return`<tr><td><span class="dot ${online(p.cid)?'on':''}"></span><span style="color:${pcv(p)};font-weight:700">${esc(p.name)}</span></td><td><b>${p.score}</b></td><td>${st}</td></tr>`;}).join('');
    const status=!rev?(S.paused?'⏸ 暫停中':'作答中'):(S.showAns?'✅ 已公布正解與得分':'已結算（大螢幕尚未公布答案）');
    return`<div class="grid2" style="grid-template-columns:1.5fr 1fr">
      <div class="panel qcard"><div class="hstage">${stageChip(S.stage)}</div><span class="tag hi">${esc(q.cat)}</span>${lvTag(q)?`<span class="tag">${esc(lvTag(q))}</span>`:''}<span class="tag">第 ${S.qi+1} / ${S.qList.length} 題</span><span class="tag">${status}</span>
        <div class="qtxt">${esc(q.q)}</div><div class="hopts">${opts}</div>
        <div class="hexp"><div class="secret">🔒 只有主持人看得到：正解與本題重點</div>${esc(q.exp)}</div></div>
      <div><div class="panel"><h3>⏱ 倒數 <span class="big-time" id="htime">${fmtT()}</span></h3>
        <div class="ctrls">
          <button class="btn" data-act="pause" ${S.phase==='question'?'':'disabled'}>${S.paused?'▶ 繼續':'⏸ 暫停'}（P）</button>
          <button class="btn pri" data-act="reveal" ${S.phase==='question'?'':'disabled'}>⏹ 結算本題（空白鍵）</button>
          <button class="btn pri" data-act="publish" ${rev&&!S.showAns?'':'disabled'}>📢 公布正解與得分（空白鍵）</button>
          <button class="btn pri" data-act="next" ${rev?'':'disabled'}>${S.qi+1>=S.qList.length?'🏁 顯示結果':'➡ 下一題'}（空白鍵）</button>
          <button class="btn danger" data-act="end">⏹ 結束遊戲</button></div>
        <p class="sub" style="margin-top:10px">流程：作答 → 結算（鎖定作答、大螢幕只顯示每人選了什麼）→ 老師講解 → 公布正解與得分 → 下一題。</p></div>
        <div class="panel"><h3>選手狀態（教師視角）</h3><table><tr><th>選手</th><th>分數</th><th>本題</th></tr>${prow}</table></div></div></div>`;
  }
  function render(){
    const msg={wait:'連線雲端中…',ok:'✅ 雲端已連線（可跨裝置）',err:'⚠️ 雲端連線失敗：目前只有同一台電腦的分頁能連線',dup:'⚠️ 此房號已在另一個分頁開啟，請關閉重複的主持人分頁'}[cloud]||'';
    app.innerHTML=`<div class="host"><header class="hh"><div><h1>${esc(TITLE)}・主持人控制台</h1><div class="sub">${msg}</div></div><div class="room"><small>房號</small><b>${room}</b></div></header>
      <div class="linkbar"><button class="btn" data-act="openScreen">🖥️ 開啟大螢幕視窗</button><button class="btn" data-act="copyScreen">複製大螢幕連結</button><button class="btn" data-act="copyPlay">複製選手連結</button></div>
      ${S.phase==='lobby'?lobbyHTML():gameHTML()}</div>`;

/* ===== 大螢幕／選手 ===== */
function startClient(role,room){
  const cid=(()=>{let c=sessionStorage.getItem(SK+'-cid');if(!c){c='p'+Math.random().toString(36).slice(2,10);sessionStorage.setItem(SK+'-cid',c);}return c;})();
  let st=null,recvAt=0,lastTs=0,lastSig='',localChoice=null,localQ=-1,full=false,T=null;
  let myName=sessionStorage.getItem(SK+'-name')||'';
  const me=()=>st&&st.players.find(p=>p.cid===cid);
  function onMsg(m){
    if(!m)return;
    if(m.t==='_open'){T.send({t:'hello',role,cid});return;}
    if(m.t==='full'&&m.cid===cid){full=true;render(true);return;}
    if(m.t!=='state')return;
    if(m.s.ts<lastTs)return;
    lastTs=m.s.ts;recvAt=Date.now();st=m.s;
    if(st.phase==='lobby'||st.qi!==localQ&&st.phase==='question'){localChoice=null;localQ=st.qi;}
    const p=me();
    if(role==='play'&&p&&st.phase==='question'&&localChoice!==null&&!p.answered&&!st.paused)T.send({t:'answer',cid,q:st.qi,choice:localChoice});
    render();
  }
  T=makeT(room,false,onMsg,()=>{});
  function join(name){myName=name;sessionStorage.setItem(SK+'-name',name);full=false;T.send({t:'join',cid,name});render(true);}
  setInterval(()=>{T.send({t:'hello',role,cid});if(role==='play'&&myName&&st&&!me()&&!full)T.send({t:'join',cid,name:myName});},3000);
  T.send({t:'hello',role,cid});
  const left=()=>{if(!st||st.phase!=='question'||st.limit===0)return 0;let r=st.remain;if(!st.paused)r-=Date.now()-recvAt;return Math.max(0,r);};
  function updTimer(){
    const bar=$('#tbar'),num=$('#tnum');if(!bar&&!num)return;
    if(!st||st.limit===0){if(num)num.textContent='∞';if(bar)bar.style.width='100%';return;}
    const l=left();if(num)num.textContent=st.phase==='question'?Math.ceil(l/1000):'—';
    if(bar)bar.style.width=(st.phase==='question'?l/(st.limit*1000)*100:0)+'%';
  }
  setInterval(updTimer,200);
  function sig(conn){
    if(!st)return'x';
    if(role==='play'&&!me())return JSON.stringify(['join',conn,myName,full]);
    return JSON.stringify([st.phase,st.paused,st.qi,conn,st.q&&st.q.ans,st.players.map(p=>[p.cid,p.ci,p.name,p.score,p.answered,p.choice,p.gain,p.on]),role==='play'?localChoice:0]);
  }
  function render(force){
    const conn=!!st&&Date.now()-recvAt<6000;
    const s=sig(conn);if(!force&&s===lastSig)return;lastSig=s;
    app.innerHTML=role==='screen'?screenHTML(conn):playHTML(conn);
    const nm=$('#nm');if(nm&&!nm.value&&myName)nm.value=myName;
    updTimer();
  }
  setInterval(()=>{if(st&&Date.now()-recvAt>6000)render();},2000);
  function slotCards(s){return Array.from({length:MAXP},(_,i)=>{const p=s.players[i];return p?`<div class="pc ${p.on?'':'off'}" style="--pc:${pcv(p)}">${av(p,'pav')}<div class="pinfo"><div class="pn">${CHARS[p.ci%4]}</div><div class="ps" style="font-size:1.5em">${esc(p.name)}</div></div></div>`:`<div class="pc empty">等待加入…</div>`;}).join('');}
  function rankHTML(s){
    return'<div class="rank">'+s.players.slice().sort((a,b)=>b.score-a.score).map(p=>{const r=rankOf(s.players,p);return`<div class="rk ${r===1?'first':''}" style="--pc:${pcv(p)}"><span class="m">${medal(r)}</span>${av(p,'pav')}<span class="n">${esc(p.name)}</span><span class="sc">${p.score} 分</span></div>`;}).join('')+'</div>';
  }
  function screenHTML(conn){
    const lost=conn?'':'<div class="lost">連線中斷，重新連線中…</div>';
    if(!st)return`<div class="scr center"><div class="ttl">${esc(TITLE)}</div><div class="hint">連線中… 房號 ${esc(room)}</div></div>`;
    const s=st;
    if(s.phase==='lobby'){
      const url=joinURL(room);
      return`<div class="scr lobby2">${lost}<div><div class="lt">${esc(TITLE)}</div><div class="stagebar">${stageChip(s.stage)}</div></div>
      <div class="lmain"><div class="lleft"><div class="joinbox">用手機<b>掃描右側 QR Code</b>加入<br>或開啟 <b>${esc(pubBase)}</b> 點「我是選手」</div><div class="rlabel">房號</div><div class="bigroom">${esc(room)}</div></div>
      <div class="lqr"><div class="qrbox">${qrSVG(url)}</div><div class="qrcap">📱 掃描加入</div><div class="qrurl">${esc(url)}</div></div></div>
      <div class="plist lg">${slotCards(s)}</div><div class="hint">等待主持人開始…</div></div>`;
    }
    if(s.phase==='end')return`<div class="scr lobby">${lost}<div class="ttl">🏆 最終排名</div><div class="stagebar">${stageChip(s.stage)}</div>${rankHTML(s)}</div>`;
    const q=s.q,rev=s.phase==='reveal',open=rev&&q.ans!=null;
    const opts=q.opts.map((o,i)=>{const m=optMeta(q.tf,i);
      const chips=rev?'<span class="chips">'+s.players.filter(p=>p.choice===i).map(p=>av(p,'chip')).join('')+'</span>':'';
      return`<div class="opt ${m.cls} ${open?(i===q.ans?'right':'dim'):''}"><span class="sym">${m.sym}</span><span class="txt">${q.tf?esc(o.slice(2)):esc(o)}</span>${chips}</div>`;}).join('');
    const maxS=Math.max(100,...s.players.map(p=>p.score));
    const cards=s.players.map(p=>{let t;
      const ch=p.choice==null?null:optMeta(q.tf,p.choice);
      if(!rev)t=p.answered?'<span class="ok">✔ 已作答</span>':'<span class="mu">思考中…</span>';
      else if(!open)t=ch?`<span class="mu">選了 ${ch.sym}</span>`:'<span class="mu">未作答</span>';
      else t=p.gain>0?`<span class="ok">${ch.sym} +${p.gain}</span>`:`<span class="bad">${ch?ch.sym+' ✘':'未作答'}</span>`;
      return`<div class="pc ${p.on?'':'off'}" style="--pc:${pcv(p)}">${av(p,'pav')}<div class="pinfo"><div class="pn">${esc(p.name)}</div><div class="ps">${p.score}</div><div class="pst">${t}</div><div class="pbar"><i style="width:${Math.max(3,Math.round(p.score/maxS*100))}%"></i></div></div></div>`;}).join('');
    const am=open?optMeta(q.tf,q.ans):null;
    const note=!rev?'':open?`<div class="exp"><b>✅ 正解：${am.sym} ${q.tf?esc(q.opts[q.ans].slice(2)):esc(q.opts[q.ans])}</b><br>${esc(q.exp)}</div>`:'<div class="wait">📣 作答結束！請聽老師講解，正確答案由老師公布</div>';
    return`<div class="scr ${rev?'rev':''}">${lost}<div class="top">${stageChip(s.stage)}<span class="cat">${esc(q.cat)}</span>${lvSpan(q,'lv')}<span class="no">第 ${s.qi+1} / ${s.total} 題</span>
      <div class="timer"><div class="bar"><i id="tbar"></i></div><b id="tnum"></b></div></div>
      <div class="question">${esc(q.q)}</div><div class="opts">${opts}</div>${note}<div class="plist">${cards}</div>
      ${s.paused&&!rev?'<div class="pause">⏸ 暫停中</div>':''}</div>`;
  }
  function playHTML(conn){
    const lost=conn?'':'<div class="lost">連線中…</div>';
    const p=me();
    if(!p){
      return`<div class="pl center">${lost}<h2>${esc(TITLE)}</h2><p class="mu">房號 ${esc(room)}</p>
        <input id="nm" maxlength="8" placeholder="輸入你的暱稱" autocomplete="off">
        <button class="btn pri" id="jn" style="font-size:20px;padding:.7em 2em">加入遊戲</button>
        <p class="bad">${full?'房間已滿（最多 4 位選手）':''}</p>${st?'':'<p class="mu">尚未連到主持人…</p>'}</div>`;
    }
    const s=st,rank=rankOf(s.players,p);
    const head=`<div class="bar2" style="--pc:${pcv(p)}"><div class="who">${av(p,'mini')}<span>${esc(p.name)}</span></div><div><span class="sc2">${p.score} 分</span> <span class="g">・第 ${rank} 名</span></div></div>`;
    if(s.phase==='lobby')return`<div class="pl">${lost}${head}<div class="pl center" style="flex:1">${av(p,'big')}<h2 style="margin-top:14px;color:${pcv(p)}">${CHARS[p.ci%4]}</h2><p class="mu">已加入！等待主持人開始遊戲…</p></div></div>`;
    if(s.phase==='end')return`<div class="pl">${lost}${head}<div class="result ${rank===1?'ok2':'nn'}">${medal(rank)} 第 ${rank} 名<small>總分 ${p.score} 分</small></div><p class="msg">看大螢幕的最終排名吧！</p></div>`;
    const q=s.q;
    if(s.phase==='reveal'){
      if(q.ans==null)return`<div class="pl">${lost}${head}<div class="result nn">本題已結算<small>正確答案由老師公布，請看大螢幕</small></div><p class="msg">請聽老師講解，等待下一題…</p></div>`;
      const am=optMeta(q.tf,q.ans);
      let cls='nn',t='這題沒作答';
      if(p.choice!=null){if(p.choice===q.ans){cls='ok2';t='答對了！ +'+p.gain;}else{cls='no2';t='答錯了';}}
      return`<div class="pl">${lost}${head}<div class="result ${cls}">${t}<small>正解：${am.sym} ${am.lab}</small></div><p class="msg">請看大螢幕的重點說明，等待下一題…</p></div>`;
    }
    const locked=localChoice!==null||p.answered||s.paused;
    const btns=q.opts.map((o,i)=>{const m=optMeta(q.tf,i);return`<button class="ab ${m.cls} ${localChoice===i?'sel':''}" data-ch="${i}" ${locked?'disabled':''}><span>${m.sym}</span><b>${m.lab}</b></button>`;}).join('');
    return`<div class="pl">${lost}${head}<div class="bar" style="height:10px"><i id="tbar"></i></div><div class="btns">${btns}</div>
      <p class="msg">${(localChoice!==null||p.answered)?'✔ 已送出，等待結算…':'請看大螢幕，選出答案'}<b id="tnum" style="margin-left:10px;color:var(--acc)"></b></p>
      ${s.paused?'<div class="pause2">⏸ 主持人暫停中</div>':''}</div>`;
  }
  app.addEventListener('click',e=>{
    if(role!=='play')return;
    if(e.target.closest('#jn')){const v=($('#nm').value||'').trim();if(!v){$('#nm').focus();return;}join(v);return;}
    const b=e.target.closest('[data-ch]');if(!b||!st)return;
    const p=me();if(!p||st.phase!=='question'||st.paused||localChoice!==null||p.answered)return;
    localChoice=parseInt(b.dataset.ch,10);localQ=st.qi;
    T.send({t:'answer',cid,q:st.qi,choice:localChoice});
    if(navigator.vibrate)try{navigator.vibrate(30);}catch(_){}
    render(true);
  });
  app.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='nm'){const v=(e.target.value||'').trim();if(v)join(v);}});
  render(true);
}

/* ===== 路由 ===== */
window.addEventListener('hashchange',()=>location.reload());
const h=location.hash.replace('#','');
const [role,room]=h.split('=');
loadBank().then(()=>{
  if(role==='host'&&/^\d{4}$/.test(room))startHost(room);
  else if((role==='screen'||role==='play')&&/^\d{4}$/.test(room))startClient(role,room);
  else home();
});
})();
</script>
